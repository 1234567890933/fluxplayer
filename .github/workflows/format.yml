name: Format

# One-off maintenance: runs the project's own ktlint formatter and commits the result.
# Delete this workflow once the tree is clean.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Apply ktlintFormat
        run: ./gradlew ktlintFormat --no-daemon --stacktrace

      - name: Commit the formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to format"
          else
            git commit -m "style: apply the project's ktlintFormat"
            git push
          fi
